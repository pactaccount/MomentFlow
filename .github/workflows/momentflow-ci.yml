name: MomentFlow CI
on:
  pull_request:
    paths: ["Prototype/**", ".github/workflows/momentflow-ci.yml"]
  push:
    paths: ["Prototype/**", ".github/workflows/momentflow-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install fastapi httpx uvicorn pydantic
      - name: Syntax verification
        run: python -m py_compile kaggle_deploy.py render_gateway.py apple_encoder.py apple_grounder.py
      - name: JavaScript syntax
        run: node --check static/app.js
