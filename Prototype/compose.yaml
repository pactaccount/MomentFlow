services:
  product:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /data
      PORT: "7860"
      PUBLIC_DEPLOYMENT: "0"
      HF_SPACE_ID: ${HF_SPACE_ID:-pactaccount/momentflow-siglip2}
      HF_TOKEN: ${HF_TOKEN:-}
      ASR_MODEL: ${ASR_MODEL:-base.en}
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./runtime:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/api/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
