<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MomentFlow</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Header -->
  <header class="nav-bar">
    <div class="nav-content">
      <span class="brand-title">MomentFlow</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="page-container">
    <section class="hero-section">
      <h1 class="hero-title">Find any moment in your video.</h1>
      <p class="hero-subtitle">Upload a video, describe what you are looking for, and watch the exact scene.</p>
    </section>

    <!-- Main Card -->
    <section class="app-card">
      <form id="search-form">
        <!-- Upload Zone -->
        <div class="input-group">
          <div id="drop-zone" class="upload-box">
            <input type="file" id="video-input" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,.mkv" class="file-input">
            <div id="upload-prompt" class="upload-prompt">
              <div class="upload-icon-circle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </div>
              <p class="upload-title">Drop your video here, or <span class="browse-link">browse</span></p>
              <p class="upload-sub">MP4, MOV, or WebM</p>
            </div>
            
            <div id="file-chip" class="file-chip" hidden>
              <div class="file-chip-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                  <line x1="7" y1="2" x2="7" y2="22"></line>
                  <line x1="17" y1="2" x2="17" y2="22"></line>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                </svg>
              </div>
              <div class="file-chip-info">
                <span id="chip-filename" class="chip-name"></span>
                <span id="chip-details" class="chip-meta"></span>
              </div>
              <button type="button" id="remove-file-btn" class="chip-remove" title="Change video">✕</button>
            </div>
          </div>
        </div>

        <!-- Search Input -->
        <div class="input-group">
          <div class="query-box">
            <span class="search-glass-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="text" id="query-input" placeholder="What moment are you looking for?" autocomplete="off" required>
            <button type="submit" id="search-btn" class="apple-button">
              <span>Find Moment</span>
            </button>
          </div>
        </div>
      </form>

      <!-- Loading State -->
      <div id="loading-state" class="state-container" hidden>
        <div class="apple-spinner"></div>
        <p class="state-title">Finding moment...</p>
      </div>

      <!-- Result Player Section -->
      <div id="result-section" class="result-section" hidden>
        <div class="player-wrapper">
          <video id="video-player" playsinline controls></video>
        </div>

        <div class="moment-card">
          <div class="moment-header">
            <div>
              <span id="moment-timestamp" class="moment-time">0:00 – 0:00</span>
            </div>
            <button type="button" id="replay-btn" class="secondary-button">
              <span>Replay Scene</span>
            </button>
          </div>

          <div class="moment-body">
            <p id="moment-explanation" class="scene-description"></p>
          </div>

          <div id="other-moments" class="other-moments" hidden>
            <p class="other-label">Other scenes</p>
            <div id="moments-list" class="moments-pills"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
